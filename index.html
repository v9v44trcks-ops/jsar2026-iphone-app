<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#123b5d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JSAR 2026">
    <title>JSAR 2026 iPhone</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p>第39回日本腹部放射線学会</p>
        <h1>演題メモ</h1>
      </div>
      <strong id="stats">読み込み中</strong>
    </header>

    <main>
      <section class="controls" aria-label="絞り込み">
        <label class="search">
          <span>検索</span>
          <input id="search-input" type="search" placeholder="番号、疾患名、演者">
        </label>
        <div class="button-row" role="group" aria-label="種別">
          <button class="is-active" data-kind="all" type="button">全て</button>
          <button data-kind="O" type="button">口演</button>
          <button data-kind="P" type="button">ポスター</button>
          <button data-kind="Q" type="button">クイズ</button>
        </div>
        <div class="button-row" role="group" aria-label="日付">
          <button class="is-active" data-day="all" type="button">全日</button>
          <button data-day="2026-06-05" type="button">6/5</button>
          <button data-day="2026-06-06" type="button">6/6</button>
          <button data-day="both" type="button">展示</button>
        </div>
        <label class="check-row">
          <input id="favorites-only" type="checkbox">
          <span>気になるだけ</span>
        </label>
      </section>

      <section class="actions" aria-label="保存と書き出し">
        <button id="export-md" type="button">メモを書き出し</button>
        <button id="export-json" type="button">バックアップ</button>
        <label class="import-button">
          復元
          <input id="import-json" type="file" accept="application/json">
        </label>
      </section>

      <section id="presentation-list" class="presentation-list" aria-live="polite"></section>
    </main>

    <template id="presentation-template">
      <article class="presentation-card">
        <div class="card-head">
          <div class="card-title-block">
            <div class="meta-line">
              <span class="code"></span>
              <span class="time"></span>
              <span class="session-name"></span>
            </div>
            <h2 class="title"></h2>
            <p class="speaker"></p>
          </div>
          <label class="favorite">
            <input type="checkbox">
            <span>気になる</span>
          </label>
        </div>

        <details class="memo-panel">
          <summary>メモ</summary>
          <div class="memo-grid">
            <label>
              疾患概念
              <textarea class="note-field" data-field="concept" rows="4"></textarea>
            </label>
            <label>
              画像所見
              <textarea class="note-field" data-field="imaging" rows="4"></textarea>
            </label>
            <label>
              病理所見
              <textarea class="note-field" data-field="pathology" rows="4"></textarea>
            </label>
            <label>
              その他
              <textarea class="note-field" data-field="other" rows="4"></textarea>
            </label>
          </div>
        </details>

        <details class="literature-panel">
          <summary>文献メモ</summary>
          <div class="literature-content"></div>
        </details>

        <details class="glossary-panel">
          <summary>用語集</summary>
          <div class="glossary-list"></div>
        </details>
      </article>
    </template>

    <script src="src/data.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
